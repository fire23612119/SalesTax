<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>語音發票建檔</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f3f5f8;color:#1d2433;font-size:16px}
header{background:#1f4e79;color:#fff;padding:12px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{font-size:13px;color:#5a6475;display:block;margin:6px 0 4px}
input,select{width:100%;font-size:17px;padding:10px;border:1px solid #c9d1dd;border-radius:8px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:10px 4px;border:2px solid #c9d1dd;border-radius:10px;background:#fff;font-size:15px;font-weight:600;text-align:center}
.tab.on{border-color:#1f4e79;background:#1f4e79;color:#fff}
.tab small{display:block;font-weight:400;font-size:12px;opacity:.85}
.now{text-align:center;padding:6px 0}
.now .lbl{font-size:15px;color:#5a6475}
.now .lbl b{color:#c0392b;font-size:20px}
#big{font-size:40px;font-weight:700;text-align:center;letter-spacing:1px;padding:14px;border:3px solid #1f4e79;border-radius:12px;margin-top:6px}
#mic{width:100%;font-size:20px;font-weight:700;padding:16px;border:none;border-radius:12px;background:#27ae60;color:#fff;margin-top:10px}
#mic.on{background:#c0392b;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.75}}
.hint{font-size:12px;color:#7a8494;margin-top:6px;line-height:1.5}
#heard{font-size:13px;color:#1f4e79;min-height:18px;margin-top:6px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 6px;border-bottom:1px solid #e4e8ee;text-align:right}
th{background:#eef2f7;font-size:13px;color:#445}
td:first-child,th:first-child{text-align:center;width:40px;color:#889}
td.cur{background:#fff3c4;outline:2px solid #e0a800}
td.edit{cursor:pointer}
.sum td{font-weight:700;background:#f7f9fb}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:12px 8px;font-size:15px;border-radius:10px;border:1px solid #c9d1dd;background:#fff;font-weight:600}
.btn.pri{background:#1f4e79;color:#fff;border-color:#1f4e79}
.btn.warn{color:#c0392b}
.tot td{font-size:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:8px}
.chk input{width:22px;height:22px}
#repWrap{margin-top:10px}#rep{font-size:20px;letter-spacing:2px;text-transform:uppercase}#repMsg{font-size:12px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<header>🎙 語音發票建檔（營業稅）</header>
<div class="wrap">

<div class="card">
  <label>公司名稱</label>
  <input id="company" placeholder="例：汶鍵股份有限公司">
  <div class="row">
    <div><label>年度（民國）</label><input id="year" type="number" inputmode="numeric" value="115"></div>
    <div><label>期別</label>
      <select id="period">
        <option value="1-2">1-2月</option><option value="3-4">3-4月</option>
        <option value="5-6">5-6月</option><option value="7-8">7-8月</option>
        <option value="9-10">9-10月</option><option value="11-12">11-12月</option>
      </select></div>
  </div>
  <label class="chk"><input type="checkbox" id="autoTax"> 稅金自動算 5%（只要唸未稅金額）</label>
</div>

<div class="card">
  <div class="tabs" id="tabs"></div>
  <div id="repWrap"><label id="repLbl">發票號碼（代表號）</label>
    <input id="rep" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="例：AB12345678">
    <div id="repMsg"></div></div>
  <div class="now">
    <div class="lbl" id="nowLbl"></div>
    <input id="big" inputmode="numeric" autocomplete="off" placeholder="講出數字">
    <div id="heard"></div>
  </div>
  <button id="mic">🎤 開始語音輸入</button>
  <div class="hint">
    • 講完一個數字停一下，就會自動跳下一格（也可以連講「25、2512」）。<br>
    • 語音按鈕不能用時：點上方大框，按<b>手機鍵盤上的麥克風</b>口述，停頓後一樣自動跳格。<br>
    • 口令：「<b>刪除</b>」刪上一格、「<b>三聯</b>／<b>電子</b>／<b>收銀機</b>」切換類別、「<b>停止</b>」關麥克風。
  </div>
</div>

<div class="card">
  <table id="grid"></table>
</div>

<div class="card">
  <table class="tot" id="tot"></table>
</div>

<div class="card btns">
  <button class="btn pri" id="exp">📥 匯出 Excel</button>
  <button class="btn" id="undo">↩ 刪上一格</button>
  <button class="btn warn" id="clear">🗑 清空本期</button>
</div>
</div>
<div id="toast"></div>

<script>
const TYPES=[
  {k:'tri',name:'三聯式',h:['三聯式發票未稅金額','三聯式發票稅金']},
  {k:'ele',name:'電子',h:['電子發票未稅金額','電子發票稅金']},
  {k:'reg',name:'收銀機',h:['收銀機發票未稅金額','收銀機發票稅金']}
];
let S={company:'',year:'115',period:'9-10',autoTax:false,type:0,data:{tri:[],ele:[],reg:[]},cur:{tri:[0,0],ele:[0,0],reg:[0,0]},rep:{tri:'',ele:'',reg:''}};
const $=id=>document.getElementById(id);
try{const s=JSON.parse(localStorage.getItem('voiceInvoice')||'null');if(s)S=Object.assign(S,s);if(!S.rep)S.rep={tri:'',ele:'',reg:''};}catch(e){}
function save(){try{localStorage.setItem('voiceInvoice',JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1600)}
const fmt=n=>(n===''||n==null)?'':Number(n).toLocaleString('en-US');
const T=()=>TYPES[S.type];
const rows=()=>S.data[T().k];
const cur=()=>S.cur[T().k];

/* ---------- 中文數字解析 ---------- */
const CN={'零':0,'〇':0,'○':0,'一':1,'壹':1,'二':2,'貳':2,'兩':2,'两':2,'三':3,'參':3,'四':4,'肆':4,'五':5,'伍':5,'六':6,'陸':6,'七':7,'柒':7,'八':8,'捌':8,'九':9,'玖':9};
const UNIT={'十':10,'拾':10,'百':100,'佰':100,'千':1000,'仟':1000};
function cnToNum(s){
  if(/^[零〇○一二三四五六七八九]+$/.test(s)&&!/[十百千萬]/.test(s)&&s.length>1)return Number([...s].map(c=>CN[c]).join(''));
  let total=0,sec=0,num=0,last=0,zero=false;
  for(const c of s){
    if(c in CN){num=CN[c];if(CN[c]===0)zero=true}
    else if(c in UNIT){sec+=(num||1)*UNIT[c];num=0;last=UNIT[c];zero=false}
    else if(c==='萬'||c==='万'){total+=(sec+num)*10000;sec=0;num=0;last=10000;zero=false}
    else if(c==='億'){total+=(sec+num)*1e8;sec=0;num=0;last=1e8;zero=false}
  }
  // 口語省略：「三萬五」=35000、「兩千五」=2500
  if(num&&!zero&&last>=100)num*=last/10;
  return total+sec+num;
}
function parseNumbers(text){
  let t=text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
            .replace(/(\d),(?=\d{3})/g,'$1').replace(/[元塊圓整]/g,' ');
  // 阿拉伯數字＋萬（例：3萬2500 → 32500）
  t=t.replace(/(\d+(?:\.\d+)?)萬(\d*)/g,(m,a,b)=>String(Math.round(Number(a)*10000)+(b?Number(b):0)));
  const out=[];
  const re=/\d+(?:\.\d+)?|[零〇○一二三四五六七八九壹貳參肆伍陸柒捌玖兩两十拾百佰千仟萬万億]+/g;let m;
  while((m=re.exec(t))){const v=/\d/.test(m[0])?Number(m[0]):cnToNum(m[0]);if(!isNaN(v))out.push(Math.round(v))}
  return out;
}

/* ---------- 輸入邏輯 ---------- */
function commit(v){
  const r=rows(),c=cur();
  while(r.length<=c[0])r.push(['','']);
  r[c[0]][c[1]]=v;
  if(S.autoTax&&c[1]===0){r[c[0]][1]=Math.round(v*0.05);c[0]++;c[1]=0}
  else if(c[1]===0)c[1]=1;else{c[0]++;c[1]=0}
  save();render();
}
function undo(){
  const r=rows(),c=cur();
  if(S.autoTax){if(c[0]===0&&c[1]===0)return;if(c[1]===0)c[0]--;c[1]=0;r.splice(c[0],1)}
  else{
    if(c[0]===0&&c[1]===0)return;
    if(c[1]===1)c[1]=0;else{c[0]--;c[1]=1}
    if(r[c[0]]){r[c[0]][c[1]]='';if(r[c[0]][0]===''&&r[c[0]][1]==='')r.splice(c[0],1)}
  }
  save();render();toast('已刪除上一格');
}
function handleText(text){
  $('heard').textContent='聽到：'+text;
  if(/刪除|删除|上一筆|上一格|錯了|取消/.test(text)){undo();return}
  if(/停止|結束/.test(text)){stopMic();return}
  if(/三聯/.test(text)){setType(0);return}
  if(/電子/.test(text)){setType(1);return}
  if(/收銀/.test(text)){setType(2);return}
  const nums=parseNumbers(text);
  if(!nums.length){toast('沒聽到數字，請再說一次');return}
  nums.forEach(commit);
  if('vibrate' in navigator)navigator.vibrate(40);
}
function setType(i){S.type=i;save();render();toast('切換：'+T().name+'發票')}

/* ---------- 大框：鍵盤麥克風／手打 ---------- */
let deb;
$('big').addEventListener('input',()=>{
  clearTimeout(deb);
  const v=$('big').value.trim();if(!v)return;
  deb=setTimeout(()=>{const x=$('big').value.trim();$('big').value='';if(x)handleText(x)},1300);
});
$('big').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(deb);const x=$('big').value.trim();$('big').value='';if(x)handleText(x)}});

/* ---------- 語音辨識 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function startMic(){
  if(!SR){toast('此瀏覽器不支援語音按鈕，請用鍵盤麥克風');$('big').focus();return}
  rec=new SR();rec.lang='zh-TW';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)handleText(e.results[i][0].transcript)};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('麥克風未授權（需 https 或改用鍵盤麥克風）');stopMic()}};
  rec.onend=()=>{if(listening)try{rec.start()}catch(e){}};
  listening=true;try{rec.start()}catch(e){}
  $('mic').classList.add('on');$('mic').textContent='⏹ 聆聽中…（點此停止）';
}
function stopMic(){listening=false;try{rec&&rec.stop()}catch(e){};$('mic').classList.remove('on');$('mic').textContent='🎤 開始語音輸入'}
$('mic').onclick=()=>listening?stopMic():startMic();

/* ---------- 畫面 ---------- */
function stats(k){const r=S.data[k].filter(x=>x[0]!==''||x[1]!=='');
  return{n:r.filter(x=>x[0]!=='').length,a:r.reduce((s,x)=>s+(+x[0]||0),0),t:r.reduce((s,x)=>s+(+x[1]||0),0)}}
function render(){
  $('company').value=S.company;$('year').value=S.year;$('period').value=S.period;$('autoTax').checked=S.autoTax;
  $('tabs').innerHTML=TYPES.map((t,i)=>{const s=stats(t.k);return`<div class="tab ${i===S.type?'on':''}" data-i="${i}">${t.name}<small>${s.n} 張</small></div>`}).join('');
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>setType(+el.dataset.i));
  $('repLbl').textContent=T().name+'發票號碼（代表號）';
  if(document.activeElement!==$('rep'))$('rep').value=S.rep[T().k]||'';
  repCheck();
  const c=cur();
  $('nowLbl').innerHTML=`${T().name}發票 第 ${c[0]+1} 張 → 請說 <b>${c[1]===0?'未稅金額':'稅金'}</b>`;
  const r=rows();let h=`<tr><th>#</th><th>未稅金額</th><th>稅金</th></tr>`;
  const n=Math.max(r.length,c[0]+1);
  for(let i=0;i<n;i++){const x=r[i]||['',''];
    h+=`<tr><td>${i+1}</td>${[0,1].map(j=>`<td class="edit ${i===c[0]&&j===c[1]?'cur':''}" data-r="${i}" data-c="${j}">${fmt(x[j])}</td>`).join('')}</tr>`}
  const s=stats(T().k);
  h+=`<tr class="sum"><td>計</td><td>${fmt(s.a)}</td><td>${fmt(s.t)}</td></tr>`;
  $('grid').innerHTML=h;
  document.querySelectorAll('td.edit').forEach(td=>td.onclick=()=>{
    const i=+td.dataset.r,j=+td.dataset.c;S.cur[T().k]=[i,j];save();render();toast(`跳到第 ${i+1} 張${j?'稅金':'未稅'}，可重新輸入`)});
  const cell=document.querySelector('td.cur');if(cell&&document.activeElement!==$('big'))cell.scrollIntoView({block:'nearest'});
  let t=`<tr><th>類別</th><th>張數</th><th>未稅合計</th><th>稅金合計</th></tr>`;let A=0,B=0,N=0;
  TYPES.forEach(ty=>{const s=stats(ty.k);A+=s.a;B+=s.t;N+=s.n;t+=`<tr><td style="width:auto">${ty.name}${S.rep[ty.k]?'<br><small style="color:#889">'+S.rep[ty.k]+'</small>':''}</td><td>${s.n}</td><td>${fmt(s.a)}</td><td>${fmt(s.t)}</td></tr>`});
  t+=`<tr class="sum"><td style="width:auto">總計</td><td>${N}</td><td>${fmt(A)}</td><td>${fmt(B)}</td></tr>`;
  $('tot').innerHTML=t;
}
$('company').oninput=e=>{S.company=e.target.value;save()};
$('year').oninput=e=>{S.year=e.target.value;save()};
$('period').onchange=e=>{S.period=e.target.value;save()};
$('autoTax').onchange=e=>{S.autoTax=e.target.checked;TYPES.forEach(t=>{if(S.autoTax)S.cur[t.k][1]=0});save();render()};
function repCheck(){const v=S.rep[T().k]||'',m=$('repMsg');
  if(!v){m.textContent='';return}
  if(/^[A-Z]{2}\d{8}$/.test(v)){m.style.color='#27ae60';m.textContent='✓ 格式正確'}
  else{m.style.color='#c0392b';m.textContent='格式應為 2 個英文字母＋8 位數字'}}
$('rep').oninput=e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=v;S.rep[T().k]=v;save();repCheck()};
$('rep').onblur=()=>render();
$('undo').onclick=undo;
let clr=0;$('clear').onclick=()=>{if(Date.now()-clr>2500){clr=Date.now();toast('再按一次確認清空');return}
  S.data={tri:[],ele:[],reg:[]};S.cur={tri:[0,0],ele:[0,0],reg:[0,0]};S.rep={tri:'',ele:'',reg:''};save();render();toast('已清空')};

/* ---------- 產生 xlsx（離線、不需外部套件） ---------- */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const[name,str]of files){
    const d=enc.encode(str),n=enc.encode(name),crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);
    h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),n,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);
    c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,n.length,true);
    c.setUint32(42,off,true);cd.push(new Uint8Array(c.buffer),n);
    off+=30+n.length+d.length;
  }
  const cdSize=cd.reduce((s,a)=>s+a.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const COL='ABCDEFG';
function buildXlsx(){
  const title=`${S.year}年${S.period}月`;
  const cols=[];TYPES.forEach(t=>{const r=S.data[t.k].filter(x=>x[0]!==''||x[1]!=='');cols.push(r.map(x=>x[0]),r.map(x=>x[1]))});
  const maxN=Math.max(1,...cols.map(c=>c.length));
  const first=4,last=first+maxN-1,cntRow=last+1,sumRow=last+2,repRow=last+3;
  const str=(ref,v,s)=>`<c r="${ref}" t="inlineStr" s="${s}"><is><t>${esc(v)}</t></is></c>`;
  const num=(ref,v,s)=>v===''||v==null?'':`<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  const fx=(ref,f,v,s)=>`<c r="${ref}" s="${s}"><f>${f}</f><v>${v}</v></c>`;
  let x='';
  x+=`<row r="1">${str('A1',S.company||'(未填公司名稱)',1)}</row>`;
  x+=`<row r="2">${str('A2',title,1)}</row>`;
  x+=`<row r="3">${TYPES.flatMap(t=>t.h).map((h,i)=>str(COL[i]+'3',h,2)).join('')}</row>`;
  for(let i=0;i<maxN;i++){const r=first+i;x+=`<row r="${r}">${cols.map((c,j)=>num(COL[j]+r,c[i],3)).join('')}</row>`}
  x+=`<row r="${cntRow}">${cols.map((c,j)=>fx(COL[j]+cntRow,`COUNT(${COL[j]}${first}:${COL[j]}${last})`,c.filter(v=>v!=='').length,4)).join('')}${str('G'+cntRow,'加總張數',5)}</row>`;
  x+=`<row r="${sumRow}">${cols.map((c,j)=>fx(COL[j]+sumRow,`SUM(${COL[j]}${first}:${COL[j]}${last})`,c.reduce((s,v)=>s+(+v||0),0),6)).join('')}${str('G'+sumRow,'加總金額',5)}</row>`;
  x+=`<row r="${repRow}">${TYPES.map((t,i)=>str(COL[i*2]+repRow,(S.rep||{})[t.k]||'',7)+str(COL[i*2+1]+repRow,'',7)).join('')}${str('G'+repRow,'發票代表號',5)}</row>`;
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="6" width="20" customWidth="1"/><col min="7" max="7" width="12" customWidth="1"/></cols><sheetData>${x}</sheetData><mergeCells count="5"><mergeCell ref="A1:F1"/><mergeCell ref="A2:F2"/><mergeCell ref="A${repRow}:B${repRow}"/><mergeCell ref="C${repRow}:D${repRow}"/><mergeCell ref="E${repRow}:F${repRow}"/></mergeCells></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="3"><font><sz val="12"/><name val="新細明體"/></font><font><b/><sz val="14"/><name val="新細明體"/></font><font><b/><sz val="12"/><name val="新細明體"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="8"><xf/><xf fontId="1" applyFont="1" applyAlignment="1"><alignment horizontal="center"/></xf><xf fontId="2" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" wrapText="1"/></xf><xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1"/><xf fontId="2" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf fontId="2" applyFont="1"/><xf numFmtId="164" fontId="2" fillId="2" borderId="1" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/><xf fontId="2" borderId="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf></cellXfs></styleSheet>`;
  return zip([
    ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(title)}" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/worksheets/sheet1.xml',sheet],
    ['xl/styles.xml',styles]
  ]);
}
$('exp').onclick=()=>{
  const blob=buildXlsx(),name=`${(S.company||'公司').replace(/[\\/:*?"<>|]/g,'')}_${S.year}年${S.period}月.xlsx`;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('已匯出 '+name);
};
render();
</script>
</body>
</html>
